[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tarvo-fechamento"
version = "0.1.0"
description = "Fechamento mensal da Tarvo Pagamentos"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "openpyxl",
    "pyyaml",
    "anthropic",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tarvo = "tarvo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
