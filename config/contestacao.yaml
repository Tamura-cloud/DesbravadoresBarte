# R29: rascunhos de e-mail de contestação, um por contraparte (Orbe e Ponte). A Helena revisa e envia.

# Pasta de saída dos rascunhos, irmã da pasta de saída do fechamento (saida/ fica só com os 6 CSVs).
pasta: contestacoes

cabecalho: "[RASCUNHO — Helena revisa antes de enviar]"
titulo_notas: "NOTAS PARA A HELENA — apagar antes de enviar"

# Nunca um e-mail inventado: a Helena preenche ao enviar.
destinatarios:
  orbe: "<e-mail da Orbe>"
  ponte: "<e-mail da Ponte>"
nomes:
  orbe: "Orbe"
  ponte: "Ponte Câmbio S.A."

# Por CNPJ de lojista (respostas da Helena às 9h53; R32, 11h37: o que decide é o contrato, não o aviso,
# então Bridge e Mundo Aberto são contestação, e a Casa, concessão fora do contrato, não entra no e-mail):
# - secao: "comunicacao" = o e-mail comunica a condição comercial e pede a regularização do período;
#          "contrato" (padrão) = o e-mail aponta taxa aplicada acima do contrato.
# - aviso: se a contraparte foi avisada da condição. Só vai nas notas internas, nunca no corpo do e-mail.
lojistas:
  "22224579000109": {secao: contrato, aviso: avisada_depois}      # Bridge
  "00520815000100": {secao: contrato, aviso: nao_avisada}         # Casa do Estudante
  "17217888000111": {secao: contrato, aviso: nao_avisada}         # Mundo Aberto
padrao_lojista: {secao: contrato, aviso: sem_registro}
textos_aviso:
  nao_avisada: "nunca foi avisada (o Comercial não comunicou a condição)."
  avisada_depois: "foi avisada só alguns dias depois do início da vigência ({inicio})."
  sem_registro: "não há registro de que a {contraparte} tenha sido avisada."

# Como a modalidade da Orbe aparece no texto (a chave é a modalidade, ou o tipo quando não há modalidade).
modalidades:
  DEBITO: "débito"
  "CREDITO A VISTA": "crédito à vista"
  "CREDITO PARCELADO": "crédito parcelado"
  PIX: "PIX"
  ANTECIPACAO: "antecipação"
  "REVERSAO ANTECIPACAO": "reversão de antecipação"

# Colunas de taxa da planilha, como aparecem no texto quando uma condição muda só algumas modalidades.
campos_taxa:
  taxa_debito: "débito"
  taxa_credito_vista: "crédito à vista"
  taxa_parc_2_6: "crédito parcelado (2 a 6x)"
  taxa_parc_7_12: "crédito parcelado (7 a 12x)"
  taxa_pix: "PIX"
  taxa_antecipacao: "antecipação"

# R32, R38: nota interna da concessão comercial (a devolução é custo da Tarvo e não vai no e-mail).
nota_concessao: "{lojista}: devolução de {valor} paga pela Tarvo (concessão, Helena 11h37). Decidir com o comercial se pede à {contraparte} parametrizar {taxa} daqui em diante."
