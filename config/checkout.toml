# Regras do checkout que NÃO estão na planilha de taxas.
# Dono: Pessoa A. Toda regra aqui cita a fonte (pergunta e resposta no HIPOTESES.md).

# ECs que existem na Orbe mas estão sem código na planilha vigente.
# Fonte: Helena, Slack 16/10 (resposta à Fox AI). Casar por CNPJ da linha da planilha.
[ec_sem_codigo]
"1043300981" = "66564512000199"  # HORIZONTE INTERCAMBIO -> Novo Horizonte Intercambio
"1043396662" = "78576234000179"  # HORIZONTE VIAGENS TURISMO -> Horizonte Viagens
"1038867654" = "07752116000126"  # KIWI EXPERIENCE TURISMO -> Kiwi Experience

# ECs sem contrato confirmado: não fatura, não gera divergência, vira pendência.
# Fonte: Helena, Slack 16/10 ("Não fatura a Atlas até o comercial confirmar").
[sem_contrato."1076801732"]
lojista = "Atlas Idiomas Ltda"
cnpj = "39566044000119"   # só na aba 'ANTIGO 2025 - nao usar' (evidência, não contrato)
quem_decide = "Diego (comercial)"

# Condições comerciais combinadas fora da planilha, com vigência pela data da venda original.
# Fonte: Helena, Slack 16/10 (resposta ao Lucca Landeiro, item 2).
[[condicoes_especiais]]
cnpj = "00520815000100"
lojista = "Casa do Estudante Viagens Ltda"
inicio = 2026-09-01
fim = 2026-12-31
taxa_pct = "0.00"         # vale para MDR e antecipação; remessa segue normal
descricao = "Tarifa zerada no checkout set-dez/2026 por acordo do comercial; a Orbe não foi avisada"

[nota]
discriminacao = "Intermediação de pagamentos (MDR e antecipação) - competência {competencia}"
